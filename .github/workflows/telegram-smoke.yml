name: Telegram Smoke Test

# Execução EXCLUSIVAMENTE manual: sem schedule, push ou outros gatilhos.
# O teste valida o envio ao Telegram sob demanda, sem tocar em Gemini, banco
# ou históricos (ver scripts/telegram-smoke.mjs).
on:
  workflow_dispatch:

# Permissões mínimas: apenas leitura do repositório.
permissions:
  contents: read

jobs:
  telegram-smoke:
    name: Enviar mensagem de teste ao Telegram
    runs-on: ubuntu-latest
    # Limite de execução desta tarefa.
    timeout-minutes: 5

    env:
      # Apenas as credenciais necessárias ao envio. São mascaradas nos logs.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci --include=dev

      - name: Compilar TypeScript
        run: npm run build

      - name: Enviar mensagem de teste ao Telegram
        # Sai com código != 0 se o envio falhar.
        run: node scripts/telegram-smoke.mjs
