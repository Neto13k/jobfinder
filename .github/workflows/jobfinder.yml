name: JobFinder

# Execução automática a cada 60 minutos (UTC) e execução manual.
# O agendamento do GitHub Actions pode atrasar e não é tempo real.
#
# O job agendado só roda quando a variável do repositório
# JOBFINDER_AUTOMATION_ENABLED for "true" (padrão: desativado, sem chamadas ao
# Gemini em agendamentos). A execução manual (workflow_dispatch) é sempre
# permitida, para disparo controlado.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Permissões mínimas: apenas leitura do repositório.
permissions:
  contents: read

# Evita execuções simultâneas do JobFinder (reduz risco de notificações duplicadas).
concurrency:
  group: jobfinder
  cancel-in-progress: false

jobs:
  run:
    name: Executar JobFinder
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Agendamento só executa com a automação habilitada; manual sempre executa.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.JOBFINDER_AUTOMATION_ENABLED == 'true' }}

    env:
      NODE_ENV: production
      # Persistência na nuvem: nunca usar arquivos JSON locais no Actions.
      JOBFINDER_STORAGE: postgres
      # Limite base de novas análises por execução; PISO do limite efetivo, que é
      # ampliado pelo orçamento de requisições da cota (padrão 5, teto de 10).
      JOBFINDER_MAX_ANALYSES: ${{ vars.JOBFINDER_MAX_ANALYSES || '5' }}
      # Vagas por requisição ao Gemini (padrão 5, teto de 10); independente do limite acima.
      JOBFINDER_ANALYSIS_BATCH_SIZE: ${{ vars.JOBFINDER_ANALYSIS_BATCH_SIZE || '5' }}
      # Cota gratuita diária do Gemini e distribuição entre as execuções (cron horário).
      JOBFINDER_GEMINI_DAILY_QUOTA: ${{ vars.JOBFINDER_GEMINI_DAILY_QUOTA || '450' }}
      JOBFINDER_GEMINI_EXECUTIONS_PER_DAY: ${{ vars.JOBFINDER_GEMINI_EXECUTIONS_PER_DAY || '24' }}
      # Intervalo mínimo entre requisições (ms), tokens de entrada por minuto (TPM)
      # e orçamento de tempo da análise (ms, contado desde o início do pipeline).
      JOBFINDER_GEMINI_MIN_INTERVAL_MS: ${{ vars.JOBFINDER_GEMINI_MIN_INTERVAL_MS || '6000' }}
      JOBFINDER_GEMINI_TPM_LIMIT: ${{ vars.JOBFINDER_GEMINI_TPM_LIMIT || '250000' }}
      JOBFINDER_GEMINI_TIME_BUDGET_MS: ${{ vars.JOBFINDER_GEMINI_TIME_BUDGET_MS || '480000' }}
      # Envios desativados por padrão; ativar via variável do repositório.
      JOBFINDER_SEND_NOTIFICATIONS: ${{ vars.JOBFINDER_SEND_NOTIFICATIONS || 'false' }}
      JOBFINDER_SEND_REVIEWS: ${{ vars.JOBFINDER_SEND_REVIEWS || 'false' }}
      # Limite de notificações por execução (padrão 3, teto de 10): compatíveis
      # antes das de revisão manual, respeitando a ordem de prioridade.
      JOBFINDER_MAX_NOTIFICATIONS: ${{ vars.JOBFINDER_MAX_NOTIFICATIONS || '3' }}
      # Recência: vagas publicadas há mais de N dias saem da análise (padrão 30,
      # mínimo 1); vagas sem data ou com data inválida/futura são preservadas.
      JOBFINDER_RECENCY_CUTOFF_DAYS: ${{ vars.JOBFINDER_RECENCY_CUTOFF_DAYS || '30' }}
      # Fila persistente de vagas pendentes entre execuções (padrão: habilitada).
      JOBFINDER_PENDING_JOBS_ENABLED: ${{ vars.JOBFINDER_PENDING_JOBS_ENABLED || 'true' }}
      JOBFINDER_PENDING_JOB_TTL_DAYS: ${{ vars.JOBFINDER_PENDING_JOB_TTL_DAYS || '7' }}
      JOBFINDER_PENDING_MAX_JOBS: ${{ vars.JOBFINDER_PENDING_MAX_JOBS || '200' }}
      # Certificado TLS público versionado no repositório.
      DATABASE_CA_CERT_PATH: ./certs/prod-ca-2021.crt
      # Segredos: nunca são impressos nos logs (mascarados pelo Actions).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --include=dev

      - name: Compilar TypeScript
        run: npm run build

      - name: Executar JobFinder
        # Falhas de banco, Gemini, providers ou Telegram aparecem na aba Actions.
        run: node dist/index.js
